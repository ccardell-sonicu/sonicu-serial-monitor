# Builds the Windows .exe and the macOS apps (Apple Silicon + Intel).
# - Every push to master and every pull request: build only, to catch breakage.
#   The builds are downloadable from the run's "Artifacts" section.
# - Pushing a tag like v1.0.0: build, then publish a GitHub Release with the files.
name: Build and release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest      # Apple Silicon
          - os: macos-15-intel    # Intel (GitHub's last Intel image, available until Aug 2027)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./build_mac.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build_windows.bat || exit /b 1
          copy "dist\windows\Sonicu Serial Monitor.exe" "dist\Sonicu-Serial-Monitor-windows.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Sonicu Serial Monitor $GITHUB_REF_NAME" \
            --generate-notes
